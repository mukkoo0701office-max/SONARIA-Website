# 試作版のプレビューを GitHub Pages に公開する（本番はさくら。これは確認用）。
# 公開先: https://mukkoo0701office-max.github.io/SONARIA-Website/
# 検索エンジンには載せない（NEXT_PUBLIC_PREVIEW=1 で noindex）。
#
# 事前設定（1回だけ・リポジトリ管理者）:
#   Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # 表示確認用のサンプル PDF（プレビューだけに入れる。本番ビルドには入れない）
      - run: cp -r preview-assets/samples public/samples

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /SONARIA-Website
          NEXT_PUBLIC_PREVIEW: "1"
          NEXT_PUBLIC_SITE_URL: https://mukkoo0701office-max.github.io/SONARIA-Website
          # 管理画面（/admin）もプレビューにだけ含める。データは Supabase のログイン＋RLS（管理人だけ）で守る
          SONARIA_ADMIN_PREVIEW: "1"
          # フォームの送信先。リポジトリ変数が未設定の間は「未接続」表示になる
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # .htaccess はさくら用。GitHub Pages では使わないので除く
      - run: rm -f out/.htaccess

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
