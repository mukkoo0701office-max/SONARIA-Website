# 管理人が手動で取得した楽譜 PDF（下書きリリース score-intake の添付）を検査し、
# GPT キューとサイト掲載の照合結果、総譜＋パート譜の組、取得リストとあわせて ci/score-intake ブランチに保存する。
# 公開・権利ステータスの変更はしない。IMSLP へは作品ページの API（api.php）を 3 秒間隔で読むだけ（PDF は取得しない）。
name: Score intake

on:
  push:
    branches: [feature/score-intake, feature/imslp-parts]
    paths:
      - "tools/score-acquisition/**"
      - ".github/workflows/score-intake.yml"
  workflow_dispatch:
  # GPT がキューを毎時更新するため、照合と取得リストも定期的に作り直す（main にマージ後に有効）
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: score-intake
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-ita tesseract-ocr-fra > /dev/null
          pip install -q pillow==11.0.0 requests==2.32.3 beautifulsoup4==4.12.3

      - name: GPT queue
        run: |
          git fetch -q origin coordination/gpt-claude-score-queue
          git show origin/coordination/gpt-claude-score-queue:docs/score-acquisition/queue.json > /tmp/queue.json

      - name: Restore previous results
        run: |
          mkdir -p /tmp/out
          if git fetch -q origin ci/score-intake 2>/dev/null; then
            git show origin/ci/score-intake:results.json > /tmp/prev.json 2>/dev/null || true
            git show origin/ci/score-intake:pages.json > /tmp/out/pages.json 2>/dev/null || true
          fi

      # 下書きリリースはリポジトリの管理者（とこのワークフロー）にしか見えない
      - name: Download intake files
        run: |
          mkdir -p /tmp/files
          rel=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" -q '[.[] | select(.draft and .name == "score-intake")][0].id // empty')
          if [ -z "$rel" ]; then
            # 初回: 受け入れ用の下書きリリースを作る（下書きのまま。公開はしない）
            gh api "repos/${GITHUB_REPOSITORY}/releases" -f tag_name=score-intake -f name=score-intake -F draft=true \
              -f body="管理人が手動で取得した楽譜 PDF の受け入れ用。下書きのまま使い、Publish しない。手順: docs/score-acquisition-intake.md" -q .html_url
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${rel}/assets?per_page=100" --paginate -q '.[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r id name; do
            case "$name" in *.pdf|*.PDF) ;; *) echo "skip (not .pdf): $name"; continue;; esac
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "/tmp/files/${name}"
          done
          ls -la /tmp/files

      # IMSLP の作品ページ（api.php）から、候補ごとに総譜＋対応するパート譜の組を選ぶ。取得済みのページは再取得しない
      - name: Score and parts sets
        run: python tools/score-acquisition/imslp_files.py --queue /tmp/queue.json --cache /tmp/out/pages.json --out /tmp/out/imslp_sets.json --md /tmp/out/imslp_sets.md

      - name: Inspect
        run: |
          python tools/score-acquisition/site_duplicates.py /tmp/queue.json /tmp/out/site_duplicates.json /tmp/out/site_duplicates.md
          python tools/score-acquisition/download_list.py /tmp/queue.json /tmp/out/site_duplicates.json /tmp/out/download_list.md /tmp/out/imslp_sets.json
          python tools/score-acquisition/intake.py --queue /tmp/queue.json --files /tmp/files \
            --catalog frontend/src/data/scores/catalog.json --prev /tmp/prev.json --sets /tmp/out/imslp_sets.json --out /tmp/out

      - name: Save to ci/score-intake
        if: always()
        run: |
          cd /tmp/out
          git init -q -b ci/score-intake
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "score intake for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/score-intake
