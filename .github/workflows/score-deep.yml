# 楽譜 PDF の詳細検査（2 回目）: 全ページのページ番号・白紙・著作権／出版社表記・パート表記。
# - 1 回目の結果（ci/score-audit の state.json）を読み、内容ごとに 1 回だけ取り直す
# - PDF は保存しない。結果（deep.json）だけを ci/score-deep ブランチに保存する。途中で止まっても再開する
name: Score deep inspect

on:
  # pull_request だと PR 全体の差分で判定され、フロントエンドを直すたびに再実行されるため push で判定する
  push:
    branches: [feature/score-migration]
    paths:
      - "tools/score-migration/deep_inspect.py"
      - ".github/workflows/score-deep.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: score-audit
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils tesseract-ocr tesseract-ocr-jpn tesseract-ocr-deu tesseract-ocr-fra tesseract-ocr-ita > /dev/null
          pip install -q -r tools/score-migration/requirements.txt

      - name: Restore audit state and previous deep results
        run: |
          mkdir -p /tmp/deepout
          git fetch -q --depth=1 origin ci/score-audit
          git show FETCH_HEAD:state.json > /tmp/state.json
          if git ls-remote --exit-code --heads origin ci/score-deep > /dev/null 2>&1; then
            git fetch -q --depth=1 origin ci/score-deep
            git show FETCH_HEAD:deep.json > /tmp/deepout/deep.json && echo "resumed"
          fi

      - name: Deep inspect
        run: python tools/score-migration/deep_inspect.py --state /tmp/state.json --out /tmp/deepout/deep.json --time-budget 18000

      - name: Save results to ci/score-deep
        if: always()
        run: |
          [ -f /tmp/deepout/deep.json ] || exit 0
          cd /tmp/deepout
          git init -q
          git checkout -q -b ci/score-deep
          git add deep.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "score deep inspect ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/score-deep
