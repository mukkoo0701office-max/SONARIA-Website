# Supabase の無料プランは 1 週間使われないと停止するため、週 2 回アクセスして停止を防ぐ。
# リポジトリ変数 NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY が未設定なら何もしない。
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase not configured; skipping"; exit 0; fi
          # 公開設定（税の扱い）を 1 件読むだけ。個人情報には触れない
          curl -fsS "$URL/rest/v1/settings?select=key&is_public=eq.true&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "ok"
