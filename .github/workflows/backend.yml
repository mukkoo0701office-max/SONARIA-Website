# バックエンド（Supabase）のテスト。CI の中でローカルの Supabase を起動し、
# 申し込みの保存・入力検証・二重送信・料金計算・ファイル・アクセス制御（RLS）・管理人操作を確認する。
# 本番の Supabase には接続しない。
name: Backend

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (validation & pricing)
        run: node supabase/tests/schema.test.mts

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function
        run: deno check supabase/functions/submit-application/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (local)
        run: supabase start

      - name: Serve Edge Functions
        run: |
          printf 'RATE_LIMIT_PER_HOUR=15\nAPPLICANT_EMAIL_ENABLED=false\n' > /tmp/functions.env
          nohup supabase functions serve --env-file /tmp/functions.env > /tmp/functions.log 2>&1 &
          eval "$(supabase status -o env)"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$API_URL/functions/v1/submit-application" || true)
            if [ "$code" = "204" ]; then echo "functions ready"; exit 0; fi
            sleep 2
          done
          echo "functions did not start"; cat /tmp/functions.log; exit 1

      - name: Integration tests
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          cd supabase/tests
          npm init -y > /dev/null
          npm install --no-audit --no-fund @supabase/supabase-js@2 > /dev/null
          node backend.test.mjs

      - name: Function logs
        if: always()
        run: tail -n 200 /tmp/functions.log || true
