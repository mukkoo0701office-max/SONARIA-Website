# IMSLP の作品ページ（api.php）から版ごとのファイル一覧を取得し、ci/imslp-files ブランチに保存する。PDF は取得しない
name: IMSLP files

on:
  push:
    branches: [feature/imslp-parts]
    paths:
      - "tools/score-acquisition/imslp_files.py"
      - ".github/workflows/imslp-files.yml"

permissions:
  contents: write

jobs:
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3 beautifulsoup4==4.12.3
      - name: GPT queue and cache
        run: |
          mkdir -p /tmp/out
          git fetch -q origin coordination/gpt-claude-score-queue
          git show origin/coordination/gpt-claude-score-queue:docs/score-acquisition/queue.json > /tmp/queue.json
          if git fetch -q origin ci/imslp-files 2>/dev/null; then
            git show FETCH_HEAD:pages.json > /tmp/out/pages.json 2>/dev/null || true
          fi
      - name: List score and parts
        run: python tools/score-acquisition/imslp_files.py --queue /tmp/queue.json --cache /tmp/out/pages.json --out /tmp/out/imslp_sets.json --md /tmp/out/imslp_sets.md
      - name: Save
        if: always()
        run: |
          cd /tmp/out && git init -q -b ci/imslp-files && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "imslp files"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/imslp-files
