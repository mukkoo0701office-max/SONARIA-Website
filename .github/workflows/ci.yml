# アプリ本体（frontend/）の lint と build を確認する。
# frontend/ に変更があるときだけ動く。
name: CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TODO: package-lock.json をコミットしたら npm ci だけにする
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - run: npm run lint
      # 料金計算・候補日時の単体テスト（申込フォーム。Issue #13）
      - run: npm test
      - run: npm run build

      # 静的書き出しで全ページが生成されたかを確認する（直接アクセス・リロードで表示できること）
      - name: Check exported pages
        run: |
          test -f out/index.html || { echo "missing: out/index.html"; exit 1; }
          test -f out/.htaccess || { echo "missing: out/.htaccess"; exit 1; }
          for lang in ja en; do
            for p in "" scores composers teachers teachers/profile bowing lessons recording performance community profile about contact apply legal/privacy; do
              f="out/$lang/${p:+$p/}index.html"
              test -f "$f" || { echo "missing: $f"; exit 1; }
            done
          done

      # 本番ビルドに講師のデモデータ（架空の講師）・楽譜の表示確認用サンプルが入っていないことを確認する
      - name: No demo data in production build
        run: |
          if grep -rq "デモ講師" out/; then echo "demo teacher data leaked into production build"; exit 1; fi
          if grep -rq "表示確認用サンプル" out/; then echo "sample score data leaked into production build"; exit 1; fi
          test ! -e out/samples || { echo "sample files leaked into production build"; exit 1; }
          # 運営者の決定（2026-11-28）で pending の版も本番で公開する。ただし「権利確認前」の表示は本番では出さない
          if grep -rq --include="*.html" "権利確認前" out/ja/scores/ 2>/dev/null; then echo "pending-rights label must not appear in production"; exit 1; fi

      # 管理画面は認証サーバーが未接続のため、本番ビルドに含めない（SONARIA_ADMIN_PREVIEW=1 のときだけ生成。next.config.ts）
      - name: No admin console in production build
        run: |
          test ! -e out/admin || { echo "admin console leaked into production build"; exit 1; }
          if grep -rq "SONARIA_ADMIN_DEMO_DATA" out/; then echo "admin demo data leaked into production build"; exit 1; fi

      # AdSense は未接続。本番ビルドで広告コードを読み込まず、プレビュー用の仮枠も出さない（data/ads.ts）
      - name: No AdSense code or preview slot in production build
        run: |
          # 文字列は JS の部品内にあるため、実際に出力された HTML だけを調べる
          if grep -rq --include="*.html" "pagead2.googlesyndication.com" out/; then echo "AdSense script must not load before it is connected"; exit 1; fi
          if grep -rq --include="*.html" "data-ad-slot-preview" out/; then echo "AdSense preview slot leaked into production build"; exit 1; fi

      # 欧州 4 言語を公開しても型が崩れないこと（全言語を公開した状態を仮に作って型チェックし、元に戻す）
      - name: Type check with all locales published
        run: |
          cp src/lib/i18n.ts /tmp/i18n.ts.bak
          sed -i 's/^export const locales = .*/export const locales = ["ja", "en", "de", "fr", "es", "it"] as const;/' src/lib/i18n.ts
          if npx tsc --noEmit -p .; then status=0; else status=1; fi
          cp /tmp/i18n.ts.bak src/lib/i18n.ts
          exit $status

      # 翻訳の状態（原文が更新された翻訳を検出。公開中の翻訳が古ければ失敗）
      - name: Translation status
        run: node scripts/translation-status.mjs

      # .htaccess は公開中の言語から生成される（未公開の言語へ振り分けない）
      - name: Generated .htaccess
        run: |
          grep -q "RewriteRule ^\$ /ja/" out/.htaccess || { echo ".htaccess must route to /ja/"; exit 1; }
          grep -q "RewriteRule ^\$ /en/" out/.htaccess || { echo ".htaccess must route to /en/"; exit 1; }
          ! grep -qE "/(de|fr|es|it)/" out/.htaccess || { echo "unpublished locales must not be routed"; exit 1; }
          ! ls -d out/de out/fr out/es out/it 2>/dev/null || { echo "unpublished locale pages must not be generated"; exit 1; }

      # GA4 は本番ビルドだけで読み込む（data/analytics.ts）
      - name: GA4 tag in production build
        run: |
          grep -q "G-HJT4YXBKPR" out/ja/index.html || { echo "GA4 tag missing in production build"; exit 1; }
          grep -q "googletagmanager.com/gtag/js" out/ja/index.html || { echo "gtag.js missing in production build"; exit 1; }

      # 品質検査（title・description・lang・JSON-LD・リンク切れ・sitemap）
      - name: Site check (production, before launch)
        run: |
          node scripts/check-site.mjs out
          grep -q "Disallow: /" out/robots.txt || { echo "robots.txt must block crawlers before launch"; exit 1; }
          grep -q 'name="robots" content="noindex' out/ja/index.html || { echo "noindex missing before launch"; exit 1; }

      # 正式公開時の設定（掲載許可・公開 URL あり）でも検査する。URL は検査用の仮の値
      - name: Site check (production, launch settings)
        run: |
          rm -rf out .next
          npm run build
          node scripts/check-site.mjs out
          grep -q "Sitemap: https://example.invalid/sitemap.xml" out/robots.txt || { echo "sitemap missing in robots.txt"; exit 1; }
          grep -q "GPTBot" out/robots.txt || { echo "AI crawler policy missing"; exit 1; }
          grep -q '<link rel="canonical" href="https://example.invalid/ja/scores/"' out/ja/scores/index.html || { echo "canonical missing"; exit 1; }
          if grep -q 'name="robots" content="noindex' out/ja/scores/index.html; then echo "launch build must be indexable"; exit 1; fi
          grep -q "<loc>https://example.invalid/ja/scores/</loc>" out/sitemap.xml || { echo "sitemap missing pages"; exit 1; }
        env:
          NEXT_PUBLIC_INDEXABLE: "1"
          NEXT_PUBLIC_SITE_URL: https://example.invalid

      - name: Upload lockfile
        if: always() && hashFiles('frontend/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: frontend/package-lock.json

      # プレビュー（GitHub Pages）用のサブパス配下ビルドも通ることを確認する
      - name: Build with preview base path
        run: |
          rm -rf out .next
          cp -r preview-assets/samples public/samples
          npm run build
          node scripts/check-site.mjs out
          # カタログの作品ページ（実データ。プレビューでは権利確認前の版も表示する）
          W=$(node -e 'const c=require("./src/data/scores/catalog.json");console.log(c.works.length?c.works[0].id:"sample-beethoven-violin-sonata-5")')
          C=$(node -e 'const c=require("./src/data/scores/catalog.json");console.log(c.works.length?c.works[0].composerId:"beethoven")')
          echo "checking work $W / composer $C"
          test -f "out/ja/scores/$W/index.html" || { echo "work page missing"; exit 1; }
          test -f "out/ja/composers/$C/index.html" || { echo "composer page missing"; exit 1; }
          grep -q '"@type":"MusicComposition"' "out/ja/scores/$W/index.html" || { echo "JSON-LD missing"; exit 1; }
          # 英語ページは英語の本文または概要がある作品だけに出す（workLocales と同じ規則）
          HAS_EN=$(node -e 'const t=require("./src/data/scores/workTexts.json").works[process.argv[1]];console.log(t&&t.summary&&t.summary.en?1:0)' "$W")
          if [ "$HAS_EN" = "1" ]; then
            test -f "out/en/scores/$W/index.html" || { echo "English page missing despite English summary"; exit 1; }
          else
            test ! -e "out/en/scores/$W" || { echo "English page must not exist without English text"; exit 1; }
          fi
          grep -q '/SONARIA-Website/_next/' out/ja/index.html || { echo "basePath not applied"; exit 1; }
          grep -q 'href="/SONARIA-Website/ja/scores/"' out/ja/index.html || { echo "links missing basePath"; exit 1; }
          grep -q 'noindex' out/ja/index.html || { echo "preview noindex missing"; exit 1; }
          ! grep -rq --include="*.html" "G-HJT4YXBKPR" out/ || { echo "GA4 must not load in preview"; exit 1; }
          grep -rq "デモ講師" out/ || { echo "preview should include demo teachers"; exit 1; }
          grep -q '/SONARIA-Website/images/site/violin-scroll-score.jpg' out/ja/index.html || { echo "image basePath missing"; exit 1; }
        env:
          NEXT_PUBLIC_BASE_PATH: /SONARIA-Website
          NEXT_PUBLIC_PREVIEW: "1"
          NEXT_PUBLIC_SITE_URL: https://mukkoo0701office-max.github.io/SONARIA-Website
