# アプリ本体（frontend/）の lint と build を確認する。
# 技術スタック確定前で frontend/ がまだ無いため、frontend/ に変更があるときだけ動く。
# 仮: Node.js 前提。スタックが変わったら書き換える。
name: CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
