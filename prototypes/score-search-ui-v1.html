</style></head><body><main><header><div><div class="brand">SONARIA</div><div class="tagline">SONG × ARIA</div></div><select id="lang" class="select" style="width:auto" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select></header><section class="intro"><h1 id="headline"></h1><div class="muted small" id="subtitle"></div></section><div class="field"><input class="search" id="query" type="search" autocomplete="off" aria-label="Search"></div><div class="field"><label id="playerslabel"></label><div class="chips" id="players"></div></div><div class="grid"><div class="field"><label id="ensemblelabel" for="ensemble"></label><select class="select" id="ensemble"></select></div><div class="field"><label id="formlabel" for="form"></label><select class="select" id="form"></select></div></div><details><summary id="advanced" style="cursor:pointer;font-size:13px;font-weight:600;padding:12px 0"></summary><div class="field"><label id="eralabel" for="era"></label><select class="select" id="era"></select></div></details><div class="between toolbar"><div><span class="count" id="count">0</span> <span class="muted small" id="worklabel"></span></div><button class="linkbutton" id="reset"></button></div><div class="between"><span class="muted small" id="sortlabel"></span><select class="select" style="width:180px" id="sort"></select></div><div id="results" aria-live="polite"></div><div class="pagination" id="pagination"></div><div class="between disclaimer"><span id="demo"></span><span id="saved"></span></div></main>
<script>
"use strict";
const works=[

[2,"無伴奏チェロ組曲 第1番","Cello Suite No. 1","バッハ","J. S. Bach",1,"strings","suite","baroque",1],

[4,"弦楽五重奏曲 ハ長調 D.956","String Quintet in C major D.956","シューベルト","Franz Schubert",5,"strings","chamber","romantic",6],
[5,"ピアノ協奏曲 第2番","Piano Concerto No. 2","ラフマニノフ","S. Rachmaninoff",5,"orchestra","concerto","romantic",2],
[6,"交響曲 第5番","Symphony No. 5","ベートーヴェン","L. van Beethoven",5,"orchestra","symphony","classical",24],

].map(([id,ja,en,cja,cen,players,ensemble,form,era,pdfs])=>({id,ja,en,cja,cen,players,ensemble,form,era,pdfs}));
const dict={
ja:{headline:"あなたの探している楽譜を。",subtitle:"作品名・作曲家・編成から探す",placeholder:"例：バッハ、ソナタ、Beethoven",players:"演奏人数",ensemble:"楽器編成",form:"楽曲形式",advanced:"詳細検索 ▾",era:"音楽史の時代",works:"作品",reset:"条件をクリア",sort:"並び替え",view:"作品詳細を見る",close:"閉じる",details:"作品詳細（試作）",detailText:"本番では作品解説、版の比較、楽章・パート一覧、PDFプレビューを表示します。",download:"PDFダウンロード（未接続）",empty:"該当する作品がありません",demo:"12件のデモデータ。実PDF・DB未接続。",saved:"保存した作品",pdf:"PDF",all:"すべて",solo:"1人",duo:"2人",trio:"3人",quartet:"4人",five:"5人以上",strings:"弦楽",piano:"ピアノ",orchestra:"管弦楽",mixed:"混合編成",chamber:"室内楽",sonata:"ソナタ",concerto:"協奏曲",symphony:"交響曲",suite:"組曲",baroque:"バロック",classical:"古典派",romantic:"ロマン派",title:"作品名",composer:"作曲家",pdfcount:"PDF数"},
en:{headline:"Discover your next score.",subtitle:"Search by title, composer or instrumentation",placeholder:"e.g. Bach, Sonata, Beethoven",players:"Performers",ensemble:"Instrumentation",form:"Form",advanced:"Advanced filters ▾",era:"Period",works:"works",reset:"Reset filters",sort:"Sort by",view:"View details",close:"Close",details:"Work details (demo)",detailText:"Production pages will show work notes, editions, movements, parts and PDF previews.",download:"Download PDF (not connected)",empty:"No matching works",demo:"12 sample works. PDFs and database not connected.",saved:"Saved works",pdf:"PDF",all:"All",solo:"Solo",duo:"Duo",trio:"Trio",quartet:"Quartet",five:"5+",strings:"Strings",piano:"Piano",orchestra:"Orchestra",mixed:"Mixed",chamber:"Chamber",sonata:"Sonata",concerto:"Concerto",symphony:"Symphony",suite:"Suite",baroque:"Baroque",classical:"Classical",romantic:"Romantic",title:"Title",composer:"Composer",pdfcount:"PDF count"}};
const state={lang:(navigator.language||"ja").toLowerCase().startsWith("ja")?"ja":"en",players:"all",ensemble:"all",form:"all",era:"all",sort:"title",page:1,open:null,favs:new Set()};
const $=id=>document.getElementById(id), t=()=>dict[state.lang];
const option=(value,label)=>{const el=document.createElement("option");el.value=value;el.textContent=label;return el};
function choices(id,keys){const el=$(id),value=id==="sort"?state.sort:state[id];el.replaceChildren(...keys.map(k=>option(k,k==="all"?t().all:k==="title"?t().title:k==="composer"?t().composer:k==="pdfcount"?t().pdfcount:t()[k])));el.value=value}
function draw(){document.documentElement.lang=state.lang;$("lang").value=state.lang;for(const k of ["headline","subtitle","advanced","demo","reset","sortlabel","playerslabel","ensemblelabel","formlabel","eralabel","worklabel"]){const map={sortlabel:"sort",playerslabel:"players",ensemblelabel:"ensemble",formlabel:"form",eralabel:"era",worklabel:"works"};$(k).textContent=t()[map[k]||k]}$("query").placeholder=t().placeholder;choices("ensemble",["all","strings","piano","orchestra","mixed"]);choices("form",["all","chamber","sonata","concerto","symphony","suite"]);choices("era",["all","baroque","classical","romantic"]);choices("sort",["title","composer","pdfcount"]);const ps=[["all","all"],["1","solo"],["2","duo"],["3","trio"],["4","quartet"],["5plus","five"]];$("players").replaceChildren(...ps.map(([v,k])=>{const b=document.createElement("button");b.className="chip";b.textContent=t()[k];b.setAttribute("aria-pressed",String(state.players===v));b.onclick=()=>{state.players=v;state.page=1;render()};return b}));render()}
function filtered(){const q=$("query").value.trim().toLocaleLowerCase();return works.filter(w=>(!q||[w.ja,w.en,w.cja,w.cen].join(" ").toLocaleLowerCase().includes(q))&&(state.players==="all"||(state.players==="5plus"?w.players>=5:w.players===Number(state.players)))&&["ensemble","form","era"].every(k=>state[k]==="all"||w[k]===state[k])).sort((a,b)=>state.sort==="pdfcount"?b.pdfs-a.pdfs:state.sort==="composer"?a.cen.localeCompare(b.cen):(state.lang==="ja"?a.ja.localeCompare(b.ja,"ja"):a.en.localeCompare(b.en)))}
function render(){const all=filtered(),perPage=5;state.page=Math.min(state.page,Math.max(1,Math.ceil(all.length/perPage)));$("count").textContent=all.length;$("saved").textContent=t().saved+": "+state.favs.size;const root=$("results");root.replaceChildren();for(const w of all.slice((state.page-1)*perPage,state.page*perPage)){const card=document.createElement("article");card.className="card";const head=document.createElement("div");head.className="cardhead";const icon=document.createElement("div");icon.className="icon";icon.textContent="♫";const group=document.createElement("div");group.className="titlegroup";const h=document.createElement("h2");h.textContent=state.lang==="ja"?w.ja:w.en;const composer=document.createElement("div");composer.className="muted small";composer.textContent=state.lang==="ja"?w.cja:w.cen;group.append(h,composer);const fav=document.createElement("button");fav.className="favorite";fav.textContent=state.favs.has(w.id)?"★":"☆";fav.setAttribute("aria-label","Favorite");fav.setAttribute("aria-pressed",String(state.favs.has(w.id)));fav.onclick=()=>{state.favs.has(w.id)?state.favs.delete(w.id):state.favs.add(w.id);render()};head.append(icon,group,fav);const tags=document.createElement("div");tags.className="tags";for(const val of [w.players>=5?t().five:state.lang==="ja"?w.players+"人":w.players+" players",t()[w.ensemble],t()[w.form],w.pdfs+" PDF"]){const tag=document.createElement("span");tag.className="tag";tag.textContent=val;tags.append(tag)}const btn=document.createElement("button");btn.className="button primary";btn.textContent=state.open===w.id?t().close:t().view;btn.setAttribute("aria-expanded",String(state.open===w.id));btn.onclick=()=>{state.open=state.open===w.id?null:w.id;render()};card.append(head,tags,btn);if(state.open===w.id){const detail=document.createElement("div");detail.className="details";const strong=document.createElement("strong");strong.textContent=t().details;const p=document.createElement("p");p.textContent=t().detailText;const dl=document.createElement("button");dl.className="button secondary";dl.disabled=true;dl.textContent=t().download;detail.append(strong,p,dl);card.append(detail)}root.append(card)}if(!all.length){const p=document.createElement("p");p.className="muted";p.textContent=t().empty;root.append(p)}const pager=$("pagination");pager.replaceChildren();if(all.length>perPage){const prev=document.createElement("button"),next=document.createElement("button"),label=document.createElement("span");prev.className=next.className="button";prev.textContent="‹";next.textContent="›";prev.disabled=state.page===1;next.disabled=state.page>=Math.ceil(all.length/perPage);prev.onclick=()=>{state.page--;state.open=null;render()};next.onclick=()=>{state.page++;state.open=null;render()};label.textContent=state.page+" / "+Math.ceil(all.length/perPage);pager.append(prev,label,next)}}
$("lang").onchange=e=>{state.lang=e.target.value;draw()};$("query").oninput=()=>{state.page=1;render()};for(const k of ["ensemble","form","era","sort"])$(k).onchange=e=>{state[k]=e.target.value;state.page=1;render()};$("reset").onclick=()=>{$("query").value="";Object.assign(state,{players:"all",ensemble:"all",form:"all",era:"all",page:1,open:null});draw()};draw();
</script></body></html>
